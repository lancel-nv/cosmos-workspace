#
# Cosmos Evaluator Database Configuration
#
# Local section for the developer-machine PostgreSQL container (cosmos-eval-local-db), auto-launched via DAZEL_RUN_DEPS
# in .dazelrc. The credentials are supplied via the env vars named below, resolved from the host env or
# ~/.cosmos_evaluator/.env (the same values that seed the container's POSTGRES_USER / POSTGRES_PASSWORD).
local:
  host: localhost
  port: 5432
  database: local
  user_env_var: COSMOS_EVALUATOR_LOCAL_DB_USER
  password_env_var: COSMOS_EVALUATOR_LOCAL_DB_PASSWORD

  # Connection timeout (seconds), consumed by the asyncpg pool in services/database/service.py.
  connect_timeout: 10
